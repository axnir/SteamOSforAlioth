%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,ams678uw01.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung AMS678UW01 6.78" 1440x3168 MIPI-DSI Panel

maintainers:
  - Timo <1788603+darknagel@users.noreply.github.com>

description:
  The Samsung AMS678UW01 is a 6.78 inch 1440x3168 MIPI-DSI CMD mode AMOLED
  panel with Display Stream Compression, found in the OnePlus 8 Pro.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,ams678uw01

  reg:
    maxItems: 1

  vdd-supply:
    description: Panel power supply

  vddio-supply:
    description: I/O source voltage rail

  # The two below are not in the upstream binding: that port powers the panel
  # from vdd and vddio alone. This board's device tree lists four rails, and
  # the panel sits behind a Pixelworks Iris bridge whose supply is one of
  # them, so they are described here instead of being left unevaluated.
  vci-supply:
    description: Panel analog supply (3.0 V)

  px-v18r-supply:
    description: 1.8 V supply of the Pixelworks Iris bridge

  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - vdd-supply
  - vddio-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,ams678uw01";
            reg = <0>;

            vdd-supply = <&vreg_l11c_3p3>;
            vddio-supply = <&vreg_l14a_1p8>;

            reset-gpios = <&tlmm 75 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };

...
