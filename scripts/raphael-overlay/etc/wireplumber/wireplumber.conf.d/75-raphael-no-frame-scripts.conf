# 两个 Frame 专属的 wireplumber 脚本在这台手机上都会把 wireplumber 搞崩，
# 形式都是 SIGSEGV。后果不是「少了某个效果」，而是**一点声音都没有**：
# 会话管理器起不来，唯一的 sink 是 "Dummy Output"。
#
# raphael 实测（2026-11-08 19:39 那次开机，journalctl）：
#
#   wireplumber[988]: default: vraudio-loader: Failed to open vraudiocompositor.so:
#       /usr/lib/ladspa/vraudiocompositor.so: cannot open shared object file
#   systemd-coredump[1071]: Process 988 (wireplumber) terminated abnormally with signal 11/SEGV
#   systemd[749]: wireplumber.service: Main process exited, code=dumped, status=11/SEGV
#   systemd[749]: wireplumber.service: Failed with result 'core-dump'
#
# 注意 `/usr/lib/ladspa/vraudiocompositor.so` 在镜像里是个**软链**，指向
# `/run/ladspa/vraudiocompositor.so`（SteamVR 运行时才铺这个目录），VR 没装就是死链。
#
# 第一个：steamos.spatial-node-config
#   /etc/wireplumber/wireplumber.conf.d/70-spatial-node-config.conf 加载
#   /etc/wireplumber/scripts/spatial-node-config.lua，后者要拉
#   vraudiocompositor.so。整份 profile 里它被标成 "required"，插件缺了就带着
#   wireplumber 一起 SEGV。alioth 2026-10-23 量到的是「一两秒一个新 PID」的崩溃
#   循环，症状是只有 Dummy Output。
#
# 第二个：steamos.microphone-tracker
#   /etc/wireplumber/scripts/microphone-tracker.lua（被 40-mic-processing.conf 标
#   "required"）里写死了
#     BUILTIN_SOURCE_NAME = "alsa_input.platform-sound.HiFi__Mic__source"
#     BUILTIN_SINK_NAME   = "alsa_output.platform-sound.HiFi__Speaker__sink"
#   这两个名字是「总线路径 + UCM 的 verb/device」拼出来的，Frame 和这几台手机
#   撞名。脚本会当成自己在 Frame 上跑，去操作并不存在的采集通路 → SEGV。
#   这台机器本来就没有给 Frame 用的麦克风滤镜，关掉它什么都不损失。
#
# 编号比 40-/70- 大、同在 /etc 下，所以后加载、后生效。
wireplumber.profiles = {
  main = {
    "steamos.spatial-node-config" = "disabled"
    "steamos.microphone-tracker" = "disabled"
  }
}
