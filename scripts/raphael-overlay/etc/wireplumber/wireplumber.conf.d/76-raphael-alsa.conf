# raphael 的声卡要让 PipeWire 真的建出 sink，得关掉 ACP。
#
# 为什么：ACP 是 ALSA 监控里读 UCM 的那一半。这台机器 **没有** sm8150/raphael 的
# UCM（上游 alsa-ucm-conf 只到 sm8250，厂商那份 alsa-xiaomi-raphael.deb 我们还没有），
# 于是 ACP 找不到 profile，一个节点都不建 —— `wpctl status` 里只剩 "Dummy Output"。
# 打开 ACP 的代价不是「差一点功能」，是完全没有输出设备。
#
# 关掉 ACP 之后 WirePlumber 退化成裸 PCM 枚举，节点名是
#   alsa_output.platform-sound.playback.0.0
# 这类形态，能直接打开 hw:0,0。**但它只解决「有 sink」，不解决「FE 没接上 BE」**：
# 内核在 2026-11-08 19:39 那次开机里说得很清楚
#
#   MultiMedia1: ASoC: no backend DAIs enabled for MultiMedia1,
#                possibly missing ALSA mixer-based routing or UCM profile
#
# 所以还要有人去设 ASoC 的路由。DTS 里 MultiMedia1 的播放后端有两条：
#   SLIM Playback   → q6afedai SLIMBUS_0_RX → wcd9340（耳机/听筒）
#   TFA9874 Playback→ q6afedai QUATERNARY_MI2S_RX → tfa9874（外放）
# 对应两个开关（numid 实测 237 / 309，切后端时两个都要动）：
#   'SLIMBUS_0_RX Audio Mixer MultiMedia1'
#   'QUAT_MI2S_RX Audio Mixer MultiMedia1'
# 这件事由 /opt/raphael/audio-route.sh 做（systemd oneshot，在会话之前）。
#
# period-size：50-alsa-config.conf 要 256 帧，这条 PCM 不干 ——
# `speaker-test -D hw:0,0` 报的可用区间是 480..16320，取 1440（4 个 period）。
# 48 kHz / S16LE / 2ch 是内核在 backend fixup 里钉死的，这里写明白省得协商错。
#
# 编号 76- 比 50-/51- 大，同在 /etc 下，所以后加载、后生效。
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = "FL,FR"
        api.alsa.period-size = 1440
        api.alsa.headroom = 1440
      }
    }
  }
]
