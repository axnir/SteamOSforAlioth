[Unit]
# Pull the power-button daemon into the Game Mode session.
#
# The "zz" is load-bearing, same as alioth's: systemd merges drop-ins in filename
# order, and steamos-overlay's 99-odin.conf carries an empty `Wants=` that resets
# whatever came before it. A drop-in sorting earlier has its Wants= wiped
# silently, and the symptom is exactly the one we are fixing -- a power button
# that does nothing in Game Mode.
#
# Asserted by scripts/assert-raphael-devr.sh (looks for 99-zz-raphael-*).
Wants=steamos-powerbuttond.service
