# Frame 的 steamos-manager.service 是 Type=notify-reload + Restart=on-failure。
# raphael 上进程能起来但不发 READY（等不存在的 CEC/TDP DBus 服务），90 秒超时
# 后无限重启，把 graphical-session.target 的整个 job 队列堵死：
# gamescope-session.service 一直 start waiting，屏幕不亮。
# 它只是 WantedBy=graphical-session.target，进程在就算起来即可。
# 同 alioth 给 steamos-manager-session-cleanup 加 8 秒超时的思路。
[Service]
Type=simple
TimeoutStartSec=15s
