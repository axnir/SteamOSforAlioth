# Frame 原版 gamescope-session.service 写着 PartOf=steamvr.service
# （「SteamVR 退出就一起退」）。去 VR 化会 mask 掉 steamvr.*，若不先清掉这个
# PartOf，用户会话一启动就 Activating special unit Exit the Session，
# gamescope 连日志都来不及打。
# 99-odin.conf 已在 /usr/lib 清过一次，这份放 /etc 优先级更高，双保险。
[Unit]
PartOf=
PartOf=graphical-session.target

[Service]
# Frame 原版是 5 秒，gamescope 起两个 Xwayland 要十几秒 —— 每轮必超时被 SIGKILL。
TimeoutStartSec=45
