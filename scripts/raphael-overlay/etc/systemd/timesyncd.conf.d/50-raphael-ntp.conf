# 照 alioth 的 50-alioth-ntp.conf。Frame 镜像里 /etc/systemd/timesyncd.conf
# 的 [Time] 全是注释，timesyncd 退回编译期的 arch pool；实测那些名字在国内
# 网络上解析不了，timesyncd 停在 "Idle." 一个包都不发，设备时间落后一整天
# （raphael 现在就是 2029-03-18，Steam 登录/证书/日志全受影响）。
#
# 用 NTP= 而不是 FallbackNTP=：后者只在 NTP= 和编译期默认都为空时才被读，
# 而这份镜像的编译期默认不为空，FallbackNTP= 永远够不着。
# 顺序是有意的：先全局名字，再国内可解析的。
[Time]
NTP=2.pool.ntp.org time.cloudflare.com cn.pool.ntp.org ntp.aliyun.com
