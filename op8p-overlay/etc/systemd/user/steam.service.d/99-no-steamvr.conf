# No VR hardware on this port, and steamvr.service dlopens steamclient.so
# before RUNSTEAM.sh has created ~/.steam/sdkarm64 — so it can never succeed
# here. Empty assignments reset the inherited Wants=/After= lists in systemd;
# masking steamvr.service alone is NOT enough (a masked unit leaves the start
# job unsatisfiable, and steam.service then dies with
# "Job steam.service/start failed with result 'dependency'").
[Unit]
Wants=
After=
